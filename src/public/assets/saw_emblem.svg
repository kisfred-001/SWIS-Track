<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Radial & Linear Gradients -->
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A71C21" />
      <stop offset="70%" stop-color="#7A1216" />
      <stop offset="100%" stop-color="#540B0E" />
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#A16207" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Golden Starburst Scallop Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#goldGradient)" filter="url(#dropShadow)" />
  <circle cx="100" cy="100" r="91" fill="#FEF1B9" />
  <circle cx="100" cy="100" r="88" fill="url(#sealBg)" />
  <circle cx="100" cy="100" r="84" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="3 2" />

  <!-- Circular Curved Text Path -->
  <path id="textArcTop" d="M 28 100 A 72 72 0 1 1 172 100" fill="none" />
  <path id="textArcBottom" d="M 172 100 A 72 72 0 1 1 28 100" fill="none" />

  <!-- Top Text: SPIRIT & WORD -->
  <text font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="14.5" fill="#FEF1B9" letter-spacing="2.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      SPIRIT &amp; WORD
    </textPath>
  </text>

  <!-- Bottom Text: ATTENDANCE TRACKING -->
  <text font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="10.5" fill="#FDE047" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ATTENDANCE TRACKING SYSTEM
    </textPath>
  </text>

  <!-- Center Crest Shield Container -->
  <circle cx="100" cy="100" r="62" fill="#540B0E" stroke="url(#goldGradient)" stroke-width="2" />
  <circle cx="100" cy="100" r="58" fill="#7A1216" />

  <!-- Radiant Light Rays in Center -->
  <path d="M 100 42 L 100 158 M 42 100 L 158 100 M 59 59 L 141 141 M 59 141 L 141 59" stroke="url(#goldGradient)" stroke-width="0.75" opacity="0.35" />

  <!-- Golden Latin Cross in Apex -->
  <g id="cross" filter="url(#dropShadow)">
    <path d="M 96 52 H 104 V 68 H 118 V 75 H 104 V 110 H 96 V 75 H 82 V 68 H 96 Z" fill="url(#goldLight)" stroke="#854D0E" stroke-width="1" />
  </g>

  <!-- Open Book of Knowledge & Word -->
  <g id="openBook" filter="url(#dropShadow)">
    <!-- Book Pages -->
    <path d="M 58 108 C 74 100 88 104 100 110 C 112 104 126 100 142 108 V 138 C 126 130 112 134 100 140 C 88 134 74 130 58 138 Z" fill="#FFFFFF" stroke="url(#goldGradient)" stroke-width="2" />
    <!-- Center Spine -->
    <line x1="100" y1="110" x2="100" y2="140" stroke="#7A1216" stroke-width="2" />
    <!-- Page Lines -->
    <line x1="68" y1="116" x2="90" y2="116" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="68" y1="123" x2="90" y2="123" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="68" y1="130" x2="88" y2="130" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="110" y1="116" x2="132" y2="116" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="110" y1="123" x2="132" y2="123" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="112" y1="130" x2="132" y2="130" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Side Stars -->
  <path d="M 38 100 L 40 95 L 45 95 L 41 98 L 43 103 L 38 100 L 33 103 L 35 98 L 31 95 L 36 95 Z" fill="url(#goldGradient)" />
  <path d="M 162 100 L 164 95 L 169 95 L 165 98 L 167 103 L 162 100 L 157 103 L 159 98 L 155 95 L 160 95 Z" fill="url(#goldGradient)" />

  <!-- Bottom Ribbon Banner: Quick, Sharp, Clever -->
  <g id="mottoRibbon">
    <path d="M 45 152 Q 100 162 155 152 L 150 166 Q 100 176 50 166 Z" fill="url(#goldGradient)" stroke="#854D0E" stroke-width="1" />
    <text x="100" y="163" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="7.5" fill="#540B0E" text-anchor="middle" font-style="italic" letter-spacing="0.5">
      The Quick, The Sharp and The Clever
    </text>
  </g>
</svg>
